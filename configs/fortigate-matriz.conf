# FortiOS 7.2.8 build 1639 — trechos extraidos do backup fornecido.
# Escopo: IPsec, interfaces dos peers e SD-WAN/SLA das VPNs.
# PSKs removidas. Portas WAN, LANs e grupos de endereco devem existir.
# Valores implicitos/defaults nao foram acrescentados.

config vpn ipsec phase1-interface
    edit "VIVO_TO_RJ"
        set interface "port2"
        set peertype any
        set net-device disable
        set proposal aes128-sha256 aes256-sha256 aes128-sha1 aes256-sha1
        set remote-gw 172.16.20.6
        # PSK removida; configurar localmente.
    next
    edit "CLARO_TO_RJ"
        set interface "port1"
        set peertype any
        set net-device disable
        set proposal aes128-sha256 aes256-sha256 aes128-sha1 aes256-sha1
        set remote-gw 172.16.10.6
        # PSK removida; configurar localmente.
    next
end

config vpn ipsec phase2-interface
    edit "VIVO_TO_RJ"
        set phase1name "VIVO_TO_RJ"
        set proposal aes128-sha1 aes256-sha1 aes128-sha256 aes256-sha256 aes128gcm aes256gcm chacha20poly1305
    next
    edit "CLARO_TO_RJ"
        set phase1name "CLARO_TO_RJ"
        set proposal aes128-sha1 aes256-sha1 aes128-sha256 aes256-sha256 aes128gcm aes256gcm chacha20poly1305
    next
end

config system interface
    edit "VIVO_TO_RJ"
        set vdom "root"
        set ip 1.1.1.2 255.255.255.255
        set allowaccess ping
        set type tunnel
        set remote-ip 1.1.1.1 255.255.255.252
        set snmp-index 9
        set interface "port2"
    next
    edit "CLARO_TO_RJ"
        set vdom "root"
        set ip 2.2.2.2 255.255.255.255
        set allowaccess ping
        set type tunnel
        set remote-ip 2.2.2.1 255.255.255.252
        set snmp-index 13
        set interface "port1"
    next
end

config system sdwan
    set status enable
    config zone
        edit "SDWAN_RIO"
        next
    end
    config members
        edit 3
            set interface "VIVO_TO_RJ"
            set zone "SDWAN_RIO"
        next
        edit 4
            set interface "CLARO_TO_RJ"
            set zone "SDWAN_RIO"
        next
    end
    config health-check
        edit "SLA_RIODEJANEIRO"
            set server "10.10.10.1"
            set update-static-route disable
            set source 10.0.10.1
            set members 4 3
            config sla
                edit 1
                    set latency-threshold 40
                    set jitter-threshold 40
                    set packetloss-threshold 8
                next
            end
        next
    end
    config service
        edit 2
            set name "SDWAN_RIODEJANEIRO"
            set mode priority
            set dst "GRP_ADDR_RIO"
            set src "GRP_ADDR_MATRIZ"
            set health-check "SLA_RIODEJANEIRO"
            set link-cost-factor packet-loss
            set priority-zone "SDWAN_RIO"
        next
    end
end
