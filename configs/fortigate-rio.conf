# AS, peers e ebgp-multipath confirmados no LAB.
# Blocos network são uma proposta; método original de originação: TODO.
# TODO: versão/build, VDOM, router-id, interfaces e máscaras dos túneis.
# TODO: IPsec, políticas, NAT, filtros BGP, SD-WAN e origem/protocolo das sondas.
# Consulte docs/addressing.md e docs/sdwan.md para os valores confirmados.
config router bgp
    set as 65000
    set ebgp-multipath enable
    config neighbor
        edit "1.1.1.2"
            set remote-as 65001
        next
        edit "2.2.2.2"
            set remote-as 65001
        next
    end
    config network
        edit 1
            set prefix 10.10.10.0 255.255.255.0
        next
        edit 2
            set prefix 10.10.20.0 255.255.255.0
        next
        edit 3
            set prefix 10.10.30.0 255.255.255.0
        next
    end
end
